# Runs the unit tests, publishes the server with Native AOT for each desktop RID, and transcribes a
# sample through the MCP protocol with the published executable. The runners have no GPU, so the
# default runtime order also checks that GPU runtimes fall back to the CPU. Each build then
# transcribes the same sample with Parakeet-ultra on the CPU and checks that the Claude Desktop
# extension carries transcribe.cpp's libraries.
# It runs only on demand for now.
name: build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            rid: win-x64
          - os: ubuntu-24.04
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: macos-15
            rid: osx-arm64
          - os: macos-15-intel
            rid: osx-x64
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install Native AOT prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev zip

      - name: Run the unit tests
        run: dotnet test --project tests/LocalWhisperMcp.Tests

      - name: Publish with Native AOT
        run: |
          if ($IsWindows) { $env:PATH = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer;$env:PATH" }
          dotnet publish src/LocalWhisperMcp -c Release -r ${{ matrix.rid }} -o out 2>&1 | Tee-Object publish.log
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Select-String -Path publish.log -Pattern 'warning IL[23]\d{3}' | ForEach-Object Line | Sort-Object -Unique

      - name: Download the test model with the server
        env:
          LOCAL_WHISPER_MODELS_DIR: ${{ github.workspace }}/models
        run: |
          ./out/local-whisper-mcp download tiny
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Transcribe through the MCP server
        env:
          LOCAL_WHISPER_MODELS_DIR: ${{ github.workspace }}/models
          LOCAL_WHISPER_MODEL: tiny
          LOCAL_WHISPER_AUTO_DOWNLOAD: "false"
          LOCAL_WHISPER_ALLOWED_ROOTS: ${{ github.workspace }}/audio
        run: |
          New-Item -ItemType Directory -Force audio | Out-Null
          Invoke-WebRequest https://raw.githubusercontent.com/ggml-org/whisper.cpp/master/samples/jfk.wav -OutFile audio/jfk.wav
          $server = Resolve-Path (Join-Path out ($IsWindows ? 'local-whisper-mcp.exe' : 'local-whisper-mcp'))
          $python = $IsWindows ? 'python' : 'python3'
          @(
            @{ name = 'status' }
            @{ name = 'transcribe'; arguments = @{ path = (Resolve-Path audio/jfk.wav).Path; language = 'en' } }
            @{ name = 'status' }
          ) | ConvertTo-Json -Depth 5 | Set-Content calls.json
          & $python scripts/mcp_smoke.py $server calls.json "ask not what your country can do for you"
          if ($LASTEXITCODE -ne 0) { exit 1 }

          # A second process shows whether the first model load, slow on Apple Silicon while Metal
          # compiles its shaders, is cached across processes. It ends by deleting the model.
          @(
            @{ name = 'transcribe'; arguments = @{ path = (Resolve-Path audio/jfk.wav).Path; language = 'en' } }
            @{ name = 'delete_models'; arguments = @{ models = @('tiny') } }
          ) | ConvertTo-Json -Depth 5 | Set-Content calls.json
          & $python scripts/mcp_smoke.py $server calls.json "ask not what your country can do for you"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (Test-Path (Join-Path $env:LOCAL_WHISPER_MODELS_DIR 'ggml-tiny.bin')) { Write-Error 'delete_models left the model in place.'; exit 1 }

      # The key is the model file's SHA-256, so the cache never serves another file under that name.
      - name: Restore the Parakeet model from the cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/parakeet-model
          key: parakeet-ultra-Q8_0-007a59761e9258779f189df396b50d12b83bb5b79e66df4b955c230d2f2a0a59

      - name: Download the Parakeet model with the server
        env:
          LOCAL_WHISPER_MODELS_DIR: ${{ github.workspace }}/parakeet-model
        run: |
          $server = Resolve-Path (Join-Path out ($IsWindows ? 'local-whisper-mcp.exe' : 'local-whisper-mcp'))
          & $server download parakeet-ultra
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $hash = (Get-FileHash (Join-Path $env:LOCAL_WHISPER_MODELS_DIR 'parakeet-ultra-Q8_0.gguf') -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '007a59761e9258779f189df396b50d12b83bb5b79e66df4b955c230d2f2a0a59') { Write-Error "The Parakeet model's SHA-256 is $hash."; exit 1 }

      - name: Run the tests that need the Parakeet model
        env:
          LOCAL_WHISPER_TEST_PARAKEET: ${{ github.workspace }}/parakeet-model/parakeet-ultra-Q8_0.gguf
        run: dotnet test --project tests/LocalWhisperMcp.Tests

      - name: Transcribe with Parakeet on the CPU through the MCP server
        env:
          LOCAL_WHISPER_MODELS_DIR: ${{ github.workspace }}/parakeet-model
          LOCAL_WHISPER_USE_GPU: "false"
          LOCAL_WHISPER_AUTO_DOWNLOAD: "false"
          LOCAL_WHISPER_ALLOWED_ROOTS: ${{ github.workspace }}/audio
        run: |
          $server = Resolve-Path (Join-Path out ($IsWindows ? 'local-whisper-mcp.exe' : 'local-whisper-mcp'))
          $audio = Join-Path $env:LOCAL_WHISPER_ALLOWED_ROOTS 'jfk.wav'
          @(
            @{ name = 'transcribe'; arguments = @{ path = $audio; model = 'parakeet-ultra'; format = 'srt' } }
            @{ name = 'transcribe'; arguments = @{ path = $audio; model = 'parakeet-ultra'; language = 'en' } }
            @{ name = 'status' }
          ) | ConvertTo-Json -Depth 5 | Set-Content calls.json
          & ($IsWindows ? 'python' : 'python3') scripts/mcp_smoke.py $server calls.json "ask not what your country can do for you"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Pack the Claude Desktop extension and check its transcribe.cpp libraries
        run: |
          pwsh packaging/mcpb/pack.ps1 -Rid ${{ matrix.rid }} -PublishDir out -OutDir dist
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $bundle = Get-ChildItem dist -Filter *.mcpb | Select-Object -First 1
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($bundle.FullName)
          $natives = @($zip.Entries | Where-Object { $_.FullName -like 'server/runtimes/transcribe/*' -and $_.Name } | ForEach-Object FullName)
          $zip.Dispose()
          $natives
          $library = $IsWindows ? 'transcribe.dll' : $IsMacOS ? 'libtranscribe.dylib' : 'libtranscribe.so'
          if ("server/runtimes/transcribe/${{ matrix.rid }}/$library" -notin $natives) { Write-Error "$($bundle.Name) has no $library for ${{ matrix.rid }}."; exit 1 }
          if ($natives | Where-Object { $_ -notlike "server/runtimes/transcribe/${{ matrix.rid }}/*" }) { Write-Error "$($bundle.Name) has transcribe.cpp files of another platform."; exit 1 }

      - name: Report the output size
        run: |
          Get-ChildItem out -Recurse -File | Select-Object @{ n = 'File'; e = { [IO.Path]::GetRelativePath('out', $_.FullName) } }, Length | Format-Table -AutoSize
